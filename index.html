<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1F497D">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="사다리">
<title>사다리 게임</title>
<style>
  :root {
    --primary: #1F497D;
    --primary-2: #2E74B5;
    --bg: #F4F7FB;
    --card: #FFFFFF;
    --text: #1B2430;
    --muted: #6B7685;
    --line: #C9D3E0;
    --win: #E53935;
    --radius: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, "Pretendard", "Noto Sans KR", "맑은 고딕", sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; min-height: 100dvh;
  }
  header {
    background: var(--primary); color: #fff;
    padding: 14px 18px; display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { margin: 0; font-size: 20px; letter-spacing: -0.3px; }
  .fx { display: flex; gap: 8px; }
  .fx button {
    width: 48px; height: 48px; border-radius: 14px; border: 2px solid rgba(255,255,255,.35);
    background: rgba(255,255,255,.15); color: #fff; font-size: 22px; line-height: 1;
  }
  .fx button.off { background: transparent; opacity: .55; }
  .fx button:active { transform: scale(.94); }
  .flash { animation: flash .9s ease; }
  @keyframes flash { 0%,100% { box-shadow: 0 0 0 0 rgba(255,213,79,0); } 30% { box-shadow: 0 0 0 6px rgba(255,213,79,.9); } }
  header .sub { font-size: 13px; opacity: .8; }
  main { flex: 1; width: 100%; max-width: 920px; margin: 0 auto; padding: 16px; }
  .hidden { display: none !important; }

  /* ── 설정 화면 ── */
  .card { background: var(--card); border-radius: var(--radius); padding: 18px; box-shadow: 0 2px 10px rgba(31,73,125,.08); margin-bottom: 14px; }
  .card h2 { margin: 0 0 12px; font-size: 17px; color: var(--primary); }
  .stepper { display: flex; align-items: center; justify-content: center; gap: 18px; }
  .stepper button {
    width: 56px; height: 56px; border-radius: 50%; border: none;
    background: var(--primary-2); color: #fff; font-size: 28px; font-weight: 700;
  }
  .stepper button:disabled { background: #B8C4D4; }
  .stepper .count { font-size: 36px; font-weight: 800; min-width: 90px; text-align: center; color: var(--primary); }
  .stepper .count small { font-size: 16px; font-weight: 600; color: var(--muted); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .col-title { font-size: 14px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
  .inputs { display: flex; flex-direction: column; gap: 8px; }
  .inputs input {
    width: 100%; height: 48px; padding: 0 12px; font-size: 16px;
    border: 1.5px solid var(--line); border-radius: 12px; background: #FAFCFF; color: var(--text);
  }
  .inputs input:focus { outline: none; border-color: var(--primary-2); background: #fff; }
  .btn {
    display: block; width: 100%; height: 58px; border: none; border-radius: var(--radius);
    font-size: 18px; font-weight: 800; color: #fff; background: var(--primary);
  }
  .btn:active, .stepper button:active { transform: scale(.97); }
  .btn.secondary { background: #fff; color: var(--primary); border: 2px solid var(--primary); }
  .btn-row { display: flex; gap: 10px; margin-top: 12px; }
  .btn-row .btn { height: 52px; font-size: 16px; }
  .action-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
  .act {
    height: 58px; border-radius: 14px; border: 2px solid var(--primary); background: #fff; color: var(--primary);
    font-size: 13px; font-weight: 800; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    padding: 0; white-space: nowrap;
  }
  .act span { font-size: 18px; line-height: 1; }
  .act.primary { background: var(--primary); color: #fff; }
  .act.kakao { background: #FEE500; border-color: #FEE500; color: #3C1E1E; }
  .act:active { transform: scale(.96); }
  @media (min-width: 600px) { .act { height: 62px; font-size: 15px; } }

  /* ── 사다리 화면 ── */
  .hint { text-align: center; color: var(--muted); font-size: 14px; margin: 2px 0 10px; }
  .board { background: var(--card); border-radius: var(--radius); padding: 10px 6px; box-shadow: 0 2px 10px rgba(31,73,125,.08); }
  .labels { display: grid; gap: 4px; }
  .name-btn {
    min-height: 48px; border: none; border-radius: 12px; padding: 4px 2px;
    font-size: 14px; font-weight: 700; color: #fff; overflow: hidden;
    line-height: 1.15; word-break: break-all;
  }
  .labels.tight .name-btn, .labels.tight .result-cell { font-size: 12px; border-radius: 9px; }
  .name-btn.done { opacity: .45; }
  .name-btn.busy { outline: 3px solid #FFD54F; }
  .result-cell {
    min-height: 44px; border-radius: 12px; padding: 4px 2px; display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; background: #EEF2F8; color: var(--text); text-align: center;
    word-break: break-all; line-height: 1.15; border: 2.5px solid transparent;
  }
  .result-cell.hit { color: #fff; }
  canvas { display: block; width: 100%; touch-action: none; }

  /* ── 결과 팝업 ── */
  .toast {
    position: fixed; left: 50%; top: 84px; transform: translate(-50%, -260%);
    background: var(--text); color: #fff; padding: 14px 22px; border-radius: 999px;
    font-size: 18px; font-weight: 800; box-shadow: 0 6px 20px rgba(0,0,0,.25);
    transition: transform .35s cubic-bezier(.2,.9,.3,1.3); max-width: 92vw; text-align: center; z-index: 40; pointer-events: none;
  }
  .toast.show { transform: translate(-50%, 0); }

  /* ── 프리셋·옵션 ── */
  .presets { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .chip {
    height: 50px; border-radius: 12px; border: 2px solid var(--line); background: #FAFCFF;
    font-size: 15px; font-weight: 700; color: var(--text);
  }
  .chip.on { border-color: var(--primary-2); background: #E3EEFA; color: var(--primary); }
  .chip:active { transform: scale(.97); }
  .amount-row { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
  .amount-row input {
    flex: 1; min-width: 0; height: 50px; padding: 0 12px; font-size: 17px; font-weight: 700; text-align: right;
    border: 1.5px solid var(--line); border-radius: 12px; background: #FAFCFF;
  }
  .amount-row .unit { font-weight: 700; color: var(--muted); }
  .amount-row button { height: 50px; padding: 0 16px; border: none; border-radius: 12px; background: var(--primary-2); color: #fff; font-size: 15px; font-weight: 800; }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .toggle-row .desc { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .switch { position: relative; width: 60px; height: 34px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .slider { position: absolute; inset: 0; background: #C3CCD8; border-radius: 999px; transition: .2s; }
  .switch .slider::before { content: ""; position: absolute; width: 28px; height: 28px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .switch input:checked + .slider { background: var(--primary-2); }
  .switch input:checked + .slider::before { transform: translateX(26px); }
  .link-btn { background: none; border: none; color: var(--muted); font-size: 13px; text-decoration: underline; padding: 6px 0; }
  .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .card-head h2 { margin: 0; }

  .result-cell.masked { background: #37474F; color: #fff; font-size: 18px; }
  .result-cell.reveal { animation: pop .45s ease; }
  @keyframes pop { 0% { transform: scale(.6) rotateY(90deg); } 70% { transform: scale(1.12); } 100% { transform: scale(1); } }

  /* ── 모달 ── */
  .overlay {
    position: fixed; inset: 0; background: rgba(15,25,40,.55); z-index: 30;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .modal {
    background: #fff; border-radius: 20px; width: 100%; max-width: 520px; max-height: 88dvh;
    display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.3);
  }
  .modal-head { padding: 16px 18px; background: var(--primary); color: #fff; font-size: 18px; font-weight: 800; display: flex; justify-content: space-between; align-items: center; }
  .modal-head button { background: none; border: none; color: #fff; font-size: 26px; line-height: 1; width: 44px; height: 44px; }
  .modal-body { padding: 14px 16px; overflow-y: auto; }
  .modal-foot { padding: 12px 16px 16px; display: flex; gap: 10px; }
  .modal-foot .btn { height: 52px; font-size: 16px; }
  table.res { width: 100%; border-collapse: collapse; font-size: 16px; }
  table.res th { background: #EBF3FB; color: var(--primary); font-size: 14px; padding: 10px 8px; text-align: left; }
  table.res td { padding: 11px 8px; border-bottom: 1px solid #E6EBF2; }
  table.res td.num { width: 36px; color: var(--muted); text-align: center; }
  table.res td .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; vertical-align: -1px; }
  table.res tr.special td { background: #FFF5F5; font-weight: 800; }
  table.res tr.special td.r { color: var(--win); }
  .summary { margin-top: 10px; font-size: 14px; color: var(--muted); text-align: right; }
  .copy-fallback { width: 100%; height: 160px; margin-top: 10px; font-size: 14px; border-radius: 10px; border: 1.5px solid var(--line); padding: 10px; }

  /* 펼친 화면(메인 디스플레이)에서는 여유 있게 */
  @media (min-width: 600px) {
    main { padding: 24px; }
    .name-btn, .result-cell { font-size: 16px; min-height: 54px; }
    .inputs { display: grid; grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>🪜 사다리 게임</h1>
    <div class="sub" id="headerSub">참가자와 결과를 입력하세요</div>
  </div>
  <div class="fx">
    <button id="soundBtn" aria-label="소리 켜기/끄기">🔊</button>
    <button id="vibeBtn" aria-label="진동 켜기/끄기">📳</button>
  </div>
</header>

<main>
  <!-- 설정 화면 -->
  <section id="setup">
    <div class="card">
      <h2>참가자 수</h2>
      <div class="stepper">
        <button id="minus" aria-label="참가자 줄이기">−</button>
        <div class="count"><span id="count">4</span><small>명</small></div>
        <button id="plus" aria-label="참가자 늘리기">+</button>
      </div>
    </div>

    <div class="card">
      <h2>🎲 결과 프리셋</h2>
      <div class="presets">
        <button class="chip" data-preset="win">🎉 꽝 / 당첨</button>
        <button class="chip" data-preset="coffee">☕ 커피 쏘기</button>
        <button class="chip" data-preset="penalty">🔥 벌칙 1~N</button>
        <button class="chip" data-preset="money">💰 금액 분배</button>
      </div>
      <div class="amount-row hidden" id="amountRow">
        <input id="amountInput" inputmode="numeric" placeholder="총 금액" autocomplete="off">
        <span class="unit">원</span>
        <button id="amountApply">분배</button>
      </div>
    </div>

    <div class="card">
      <div class="toggle-row">
        <div>
          <div style="font-weight:800;color:var(--primary)">🙈 결과 숨기기</div>
          <div class="desc">결과를 가려두고 도착할 때 하나씩 공개</div>
        </div>
        <label class="switch"><input type="checkbox" id="hideToggle"><span class="slider"></span></label>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <span></span>
        <button class="link-btn" id="clearNames">이름 모두 지우기</button>
      </div>
      <div class="grid">
        <div>
          <div class="col-title">👤 참가자 이름</div>
          <div class="inputs" id="nameInputs"></div>
        </div>
        <div>
          <div class="col-title">🎯 결과 항목</div>
          <div class="inputs" id="resultInputs"></div>
        </div>
      </div>
    </div>

    <button class="btn" id="startBtn">사다리 생성</button>
  </section>

  <!-- 사다리 화면 -->
  <section id="game" class="hidden">
    <p class="hint" id="hint">이름을 탭하면 사다리를 따라 내려갑니다</p>
    <div class="board" id="board">
      <div class="labels" id="topLabels"></div>
      <canvas id="canvas"></canvas>
      <div class="labels" id="bottomLabels"></div>
    </div>
    <div class="action-bar">
      <button class="act" id="backBtn"><span>✏️</span>다시입력</button>
      <button class="act primary" id="shuffleBtn"><span>🔀</span>새로생성</button>
      <button class="act" id="allBtn"><span>📊</span>결과보기</button>
      <button class="act kakao" id="shareBtn"><span>💬</span>결과공유</button>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<div class="overlay hidden" id="overlay">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head"><span>📊 전체 결과</span><button id="closeModal" aria-label="닫기">×</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot">
      <button class="btn secondary" id="closeModal2">닫기</button>
      <button class="btn" id="shareBtn2" style="background:#FEE500;color:#3C1E1E">💬 결과 복사</button>
    </div>
  </div>
</div>

<script>
(() => {
  const MIN = 2, MAX = 10;
  const COLORS = ["#E53935","#1E88E5","#43A047","#FB8C00","#8E24AA","#00ACC1","#D81B60","#6D4C41","#3949AB","#7CB342"];

  const $ = (id) => document.getElementById(id);
  const state = {
    count: 4,
    names: [],
    results: [],
    rows: 0,
    rungs: [],      // rungs[row][gap] = true → gap 열과 gap+1 열 사이 가로줄
    paths: {},      // 참가자 index → { points, end, progress }
    animating: false,
    hide: false,
    preset: null,
    amount: "",
    sound: true,
    vibe: true,
  };

  // ── 저장/불러오기 (실패해도 동작) ──
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem("ladder-setup") || "null");
      if (s && s.count) {
        state.count = s.count; state.names = s.names || []; state.results = s.results || [];
        state.hide = !!s.hide;
        if (s.sound === false) state.sound = false;
        if (s.vibe === false) state.vibe = false; state.preset = s.preset || null; state.amount = s.amount || "";
      }
    } catch (e) {}
  }
  function save() {
    try { localStorage.setItem("ladder-setup", JSON.stringify({ count: state.count, names: state.names, results: state.results, hide: state.hide, preset: state.preset, amount: state.amount, sound: state.sound, vibe: state.vibe })); } catch (e) {}
  }

  // ── 설정 화면 ──
  function defaultResult(i, n) { return i === 0 ? "당첨 🎉" : "꽝"; }

  function renderInputs() {
    $("count").textContent = state.count;
    $("minus").disabled = state.count <= MIN;
    $("plus").disabled = state.count >= MAX;
    const ni = $("nameInputs"), ri = $("resultInputs");
    ni.innerHTML = ""; ri.innerHTML = "";
    for (let i = 0; i < state.count; i++) {
      const a = document.createElement("input");
      a.placeholder = `참가자 ${i + 1}`; a.value = state.names[i] || ""; a.maxLength = 12;
      a.addEventListener("input", () => { state.names[i] = a.value; save(); });
      ni.appendChild(a);
      const b = document.createElement("input");
      b.placeholder = defaultResult(i, state.count); b.value = state.results[i] || ""; b.maxLength = 12;
      b.addEventListener("input", () => { state.results[i] = b.value; state.preset = null; renderPresetUI(); save(); });
      ri.appendChild(b);
    }
    renderPresetUI();
  }

  function changeCount(d) {
    const n = state.count + d;
    if (n < MIN || n > MAX) return;
    state.count = n;
    if (state.preset && state.preset !== "money") applyPreset(state.preset);
    else if (state.preset === "money" && state.amount) applyPreset("money");
    save(); renderInputs();
  }
  $("minus").onclick = () => changeCount(-1);
  $("plus").onclick  = () => changeCount(1);

  // ── 결과 프리셋 ──
  const fmt = (v) => v.toLocaleString("ko-KR");
  function splitAmount(total, n) {
    // 100원 단위로 랜덤 비율 분배, 합계는 정확히 total
    const unit = total >= n * 1000 ? 100 : 1;
    const units = Math.floor(total / unit);
    const w = Array.from({ length: n }, () => 0.3 + Math.random());
    const sum = w.reduce((a, b) => a + b, 0);
    const parts = w.map(x => Math.floor(units * x / sum));
    let left = units - parts.reduce((a, b) => a + b, 0);
    while (left-- > 0) parts[Math.floor(Math.random() * n)]++;
    const out = parts.map(p => p * unit);
    out[Math.floor(Math.random() * n)] += total - units * unit; // 100원 미만 잔액
    return out;
  }
  function applyPreset(kind) {
    const n = state.count;
    let r = [];
    if (kind === "win") r = Array.from({ length: n }, (_, i) => i === 0 ? "당첨 🎉" : "꽝");
    if (kind === "coffee") r = Array.from({ length: n }, (_, i) => i === 0 ? "☕ 커피 쏘기" : "통과");
    if (kind === "penalty") r = Array.from({ length: n }, (_, i) => `벌칙 ${i + 1}`);
    if (kind === "money") {
      const total = parseInt(String(state.amount).replace(/[^0-9]/g, ""), 10);
      if (!total || total < n) { showToast("총 금액을 입력해 주세요"); return false; }
      r = splitAmount(total, n).map(v => fmt(v) + "원");
    }
    state.results = r;
    return true;
  }
  document.querySelectorAll(".chip").forEach(chip => {
    chip.onclick = () => {
      const kind = chip.dataset.preset;
      state.preset = kind;
      if (kind === "money") {
        renderPresetUI();
        if (state.amount) applyPreset("money");
        else { $("amountInput").focus(); }
      } else applyPreset(kind);
      save(); renderInputs();
    };
  });
  $("amountInput").addEventListener("input", (e) => {
    const digits = e.target.value.replace(/[^0-9]/g, "").slice(0, 10);
    e.target.value = digits ? fmt(parseInt(digits, 10)) : "";
    state.amount = digits; save();
  });
  $("amountApply").onclick = () => { if (applyPreset("money")) { save(); renderInputs(); showToast("랜덤 비율로 분배했습니다"); } };
  function renderPresetUI() {
    document.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c.dataset.preset === state.preset));
    $("amountRow").classList.toggle("hidden", state.preset !== "money");
    $("amountInput").value = state.amount ? fmt(parseInt(state.amount, 10)) : "";
    $("hideToggle").checked = state.hide;
  }
  $("hideToggle").onchange = (e) => { state.hide = e.target.checked; save(); };
  $("clearNames").onclick = () => { state.names = []; save(); renderInputs(); showToast("참가자 이름을 지웠습니다"); };

  // ── 사다리 생성 ──
  function generateLadder() {
    const n = state.count;
    state.rows = Math.max(10, n * 2 + 4);
    let ok = false;
    while (!ok) {
      state.rungs = [];
      for (let r = 0; r < state.rows; r++) {
        const row = new Array(n - 1).fill(false);
        for (let g = 0; g < n - 1; g++) {
          // 인접 가로줄 겹침 방지: 바로 왼쪽 칸에 가로줄이 있으면 놓지 않음
          if (g > 0 && row[g - 1]) continue;
          row[g] = Math.random() < 0.45;
        }
        state.rungs.push(row);
      }
      // 모든 칸 사이에 가로줄이 최소 1개는 있어야 재미있음
      ok = true;
      for (let g = 0; g < n - 1; g++) {
        if (!state.rungs.some(row => row[g])) { ok = false; break; }
      }
    }
    state.paths = {};
  }

  // 출발 열에서 도착 열까지 경로(열·행 좌표) 계산
  function tracePath(start) {
    let c = start;
    const pts = [{ c, r: -0.5 }];
    for (let r = 0; r < state.rows; r++) {
      pts.push({ c, r });
      if (state.rungs[r][c]) c = c + 1;
      else if (c > 0 && state.rungs[r][c - 1]) c = c - 1;
      pts.push({ c, r });
    }
    pts.push({ c, r: state.rows - 0.5 });
    return { points: pts, end: c };
  }

  // ── 그리기 ──
  const canvas = $("canvas"), ctx = canvas.getContext("2d");
  let geo = null;

  function layout() {
    const n = state.count;
    const board = $("board");
    const width = board.clientWidth - 12;
    const tpl = `repeat(${n}, 1fr)`;
    $("topLabels").style.gridTemplateColumns = tpl;
    $("bottomLabels").style.gridTemplateColumns = tpl;
    const tight = width / n < 64;
    $("topLabels").classList.toggle("tight", tight);
    $("bottomLabels").classList.toggle("tight", tight);

    // 화면 높이에 맞춰 사다리 높이 결정 (접은/펼친 화면 모두 대응)
    canvas.style.height = "0px";
    const mainPad = parseFloat(getComputedStyle(document.querySelector("main")).paddingBottom) || 0;
    const used = $("game").getBoundingClientRect().bottom + window.scrollY + mainPad;
    const height = Math.max(220, Math.min(window.innerHeight - used - 2, 900));
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    canvas.style.height = height + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const colW = (width - 4 * (n - 1)) / n;
    geo = {
      width, height,
      x: (c) => c * (colW + 4) + colW / 2,
      y: (r) => 12 + ((r + 0.5) / state.rows) * (height - 24),
    };
  }

  function toXY(p) { return { x: geo.x(p.c), y: geo.y(p.r) }; }

  function pathLength(pts) {
    let L = 0;
    for (let i = 1; i < pts.length; i++) {
      const a = toXY(pts[i - 1]), b = toXY(pts[i]);
      L += Math.hypot(b.x - a.x, b.y - a.y);
    }
    return L;
  }

  function draw() {
    if (!geo) return;
    const n = state.count;
    ctx.clearRect(0, 0, geo.width, geo.height);
    ctx.lineCap = "round"; ctx.lineJoin = "round";

    // 세로줄
    ctx.strokeStyle = "#B7C3D3"; ctx.lineWidth = 4;
    for (let c = 0; c < n; c++) {
      ctx.beginPath(); ctx.moveTo(geo.x(c), 0); ctx.lineTo(geo.x(c), geo.height); ctx.stroke();
    }
    // 가로줄
    for (let r = 0; r < state.rows; r++) {
      for (let g = 0; g < n - 1; g++) {
        if (!state.rungs[r][g]) continue;
        ctx.beginPath(); ctx.moveTo(geo.x(g), geo.y(r)); ctx.lineTo(geo.x(g + 1), geo.y(r)); ctx.stroke();
      }
    }
    // 이동 경로
    for (const k of Object.keys(state.paths)) {
      const p = state.paths[k];
      drawPartial(p.points, p.progress, COLORS[k % COLORS.length]);
    }
  }

  function drawPartial(pts, progress, color) {
    const total = pathLength(pts);
    let remain = total * progress;
    ctx.strokeStyle = color; ctx.lineWidth = 6;
    ctx.beginPath();
    let a = toXY(pts[0]);
    ctx.moveTo(a.x, 0);
    ctx.lineTo(a.x, a.y);
    let head = a;
    for (let i = 1; i < pts.length && remain > 0; i++) {
      const b = toXY(pts[i]);
      const seg = Math.hypot(b.x - a.x, b.y - a.y);
      if (seg <= remain) { ctx.lineTo(b.x, b.y); head = b; remain -= seg; }
      else {
        const t = remain / seg;
        head = { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
        ctx.lineTo(head.x, head.y); remain = 0;
      }
      a = b;
    }
    if (progress >= 1) ctx.lineTo(head.x, geo.height);
    ctx.stroke();
    // 진행 중인 말(점)
    if (progress < 1) {
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(head.x, head.y, 10, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(head.x, head.y, 4, 0, Math.PI * 2); ctx.fill();
    }
  }

  // ── 라벨 ──
  function nameOf(i) { return (state.names[i] || "").trim() || (state.count >= 6 ? `${i + 1}번` : `참가자 ${i + 1}`); }
  function resultOf(i) { return (state.results[i] || "").trim() || defaultResult(i, state.count); }

  function renderLabels() {
    const top = $("topLabels"), bottom = $("bottomLabels");
    top.innerHTML = ""; bottom.innerHTML = "";
    for (let i = 0; i < state.count; i++) {
      const b = document.createElement("button");
      b.className = "name-btn";
      b.style.background = COLORS[i % COLORS.length];
      b.textContent = nameOf(i);
      b.onclick = () => run(i, b);
      top.appendChild(b);

      const d = document.createElement("div");
      d.className = "result-cell";
      d.id = "res-" + i;
      if (state.hide) { d.classList.add("masked"); d.textContent = "?"; }
      else d.textContent = resultOf(i);
      bottom.appendChild(d);
    }
  }

  // ── 효과음 (Web Audio API, 오디오 파일 없음) ──
  let actx = null;
  function audio() {
    if (!state.sound) return null;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") actx.resume();
      return actx;
    } catch (e) { return null; }
  }
  // 하나의 음 재생: 주파수, 시작 지연, 길이, 파형, 음량, 끝 주파수(글리산도)
  function tone(freq, at, dur, type = "triangle", vol = 0.25, endFreq) {
    const a = audio(); if (!a) return;
    const t = a.currentTime + at;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }
  const sfx = {
    tick() { tone(1900, 0, 0.035, "square", 0.08); },
    start() { tone(520, 0, 0.08, "triangle", 0.18); tone(780, 0.07, 0.1, "triangle", 0.18); },
    win() { // 빰빠밤~ 팡파레
      [523, 659, 784].forEach((f, k) => tone(f, k * 0.11, 0.16, "square", 0.12));
      [1047, 1319, 1568].forEach(f => tone(f, 0.36, 0.7, "triangle", 0.16));
      tone(523, 0.36, 0.7, "sawtooth", 0.05);
    },
    lose() { // 뿌우~웅 (내려가는 트롬본)
      tone(392, 0, 0.28, "sawtooth", 0.12, 370);
      tone(370, 0.3, 0.28, "sawtooth", 0.12, 349);
      tone(349, 0.6, 0.7, "sawtooth", 0.12, 260);
    },
    neutral() { tone(880, 0, 0.18, "sine", 0.2); tone(1320, 0.12, 0.35, "sine", 0.18); },
  };
  // ── 진동 (Vibration API) ──
  function vibrate(pattern) {
    if (!state.vibe || !navigator.vibrate) return;
    try { navigator.vibrate(pattern); } catch (e) {}
  }
  // 결과 종류: 당첨류(팡파레) / 꽝류 / 중립(벌칙 번호·금액)
  function outcomeOf(result) {
    if (state.preset === "penalty" || state.preset === "money") return "neutral";
    return isSpecial(result) ? "win" : "lose";
  }

  function renderFx() {
    $("soundBtn").textContent = state.sound ? "🔊" : "🔇";
    $("soundBtn").classList.toggle("off", !state.sound);
    $("vibeBtn").textContent = state.vibe ? "📳" : "📴";
    $("vibeBtn").classList.toggle("off", !state.vibe);
  }
  $("soundBtn").onclick = () => {
    state.sound = !state.sound; save(); renderFx();
    if (state.sound) sfx.tick();
    showToast(state.sound ? "소리 켜짐 🔊" : "소리 꺼짐 🔇");
  };
  $("vibeBtn").onclick = () => {
    state.vibe = !state.vibe; save(); renderFx();
    if (state.vibe) vibrate(40);
    showToast(state.vibe ? "진동 켜짐 📳" : "진동 꺼짐 📴");
  };

  // 경로에서 가로줄을 건너기 시작하는 지점(전체 길이 대비 비율) 목록
  function crossingMarks(pts) {
    const total = pathLength(pts);
    const marks = [];
    let acc = 0;
    for (let k = 1; k < pts.length; k++) {
      const a = toXY(pts[k - 1]), b = toXY(pts[k]);
      if (pts[k - 1].c !== pts[k].c) marks.push(acc / total);
      acc += Math.hypot(b.x - a.x, b.y - a.y);
    }
    return marks;
  }

  // ── 애니메이션 ──
  function run(i, btn) {
    if (state.animating || state.paths[i]) return;
    state.animating = true;
    btn.classList.add("busy");
    const { points, end } = tracePath(i);
    const p = state.paths[i] = { points, end, progress: 0 };
    const duration = 1600 + state.rows * 90; // 천천히 따라가기
    const marks = crossingMarks(points);
    let nextMark = 0;
    audio(); // 탭 순간에 오디오 잠금 해제
    sfx.start();
    const t0 = performance.now();

    function frame(now) {
      p.progress = Math.min(1, (now - t0) / duration);
      while (nextMark < marks.length && p.progress >= marks[nextMark]) {
        nextMark++; sfx.tick(); vibrate(18);
      }
      draw();
      if (p.progress < 1) requestAnimationFrame(frame);
      else {
        state.animating = false;
        btn.classList.remove("busy"); btn.classList.add("done");
        revealCell(end, i);
        const res = resultOf(end);
        const kind = outcomeOf(res);
        if (kind === "win") { sfx.win(); vibrate([120, 70, 120, 70, 450]); $("res-" + end).classList.add("flash"); }
        else if (kind === "lose") { sfx.lose(); vibrate(60); }
        else { sfx.neutral(); vibrate([40, 50, 40]); }
        showToast(`${nameOf(i)} → ${res}`);
        if (Object.keys(state.paths).length === state.count) {
          $("hint").textContent = "모든 결과가 나왔습니다! 🎉";
        }
      }
    }
    requestAnimationFrame(frame);
  }

  function revealCell(col, who) {
    const cell = $("res-" + col);
    if (cell.classList.contains("masked")) {
      cell.classList.remove("masked");
      cell.textContent = resultOf(col);
      cell.classList.remove("reveal"); void cell.offsetWidth; cell.classList.add("reveal");
    }
    if (who !== undefined) {
      cell.classList.add("hit");
      cell.style.background = COLORS[who % COLORS.length];
    }
  }

  // ── 전체 결과 ──
  function isSpecial(r) { return !/^(꽝|통과)$/.test(r.trim()); }
  function allResults() {
    return Array.from({ length: state.count }, (_, i) => {
      const end = tracePath(i).end;
      return { i, name: nameOf(i), result: resultOf(end), end };
    });
  }
  function openAll() {
    if (state.animating) return;
    const rows = allResults();
    rows.forEach(r => revealCell(r.end, r.i));
    const highlight = state.preset !== "penalty" && state.preset !== "money";
    let html = `<table class="res"><thead><tr><th></th><th>참가자</th><th>결과</th></tr></thead><tbody>`;
    for (const r of rows) {
      const sp = highlight && isSpecial(r.result);
      html += `<tr class="${sp ? "special" : ""}"><td class="num">${r.i + 1}</td>` +
        `<td><span class="dot" style="background:${COLORS[r.i % COLORS.length]}"></span>${esc(r.name)}</td>` +
        `<td class="r">${esc(r.result)}</td></tr>`;
    }
    html += `</tbody></table>`;
    if (state.preset === "money") {
      const sum = rows.reduce((a, r) => a + (parseInt(r.result.replace(/[^0-9]/g, ""), 10) || 0), 0);
      html += `<div class="summary">합계 ${fmt(sum)}원</div>`;
    }
    $("modalBody").innerHTML = html;
    $("overlay").classList.remove("hidden");
    $("hint").textContent = "전체 결과가 공개되었습니다";
  }
  function esc(t) { return t.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
  function closeModal() { $("overlay").classList.add("hidden"); }
  $("allBtn").onclick = openAll;
  $("closeModal").onclick = closeModal;
  $("closeModal2").onclick = closeModal;
  $("overlay").onclick = (e) => { if (e.target.id === "overlay") closeModal(); };

  // ── 결과 공유 (텍스트 복사 → 카톡 붙여넣기) ──
  function shareText() {
    const d = new Date();
    const stamp = `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
    const rows = allResults();
    const lines = [`🪜 사다리 게임 결과 (${stamp})`, ""];
    rows.forEach(r => lines.push(`${r.name} → ${r.result}`));
    if (state.preset === "money" && state.amount) lines.push("", `💰 총 ${fmt(parseInt(state.amount, 10))}원 랜덤 분배`);
    return lines.join("\n");
  }
  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
    try {
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand("copy");
      ta.remove(); return ok;
    } catch (e) { return false; }
  }
  async function share() {
    if (state.animating) return;
    const text = shareText();
    if (await copyText(text)) {
      showToast("결과를 복사했습니다. 카톡에 붙여넣으세요 💬");
    } else {
      // 복사가 막힌 환경: 직접 길게 눌러 복사하도록 표시
      openAll();
      const ta = document.createElement("textarea");
      ta.className = "copy-fallback"; ta.readOnly = true; ta.value = text;
      $("modalBody").appendChild(ta); ta.select();
      showToast("아래 글을 길게 눌러 복사해 주세요");
    }
  }
  $("shareBtn").onclick = share;
  $("shareBtn2").onclick = share;

  let toastTimer;
  function showToast(msg) {
    const t = $("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
  }

  // ── 화면 전환 ──
  function startGame() {
    generateLadder();
    $("setup").classList.add("hidden");
    $("game").classList.remove("hidden");
    $("headerSub").textContent = `${state.count}명 참가`;
    $("hint").textContent = "이름을 탭하면 사다리를 따라 내려갑니다";
    renderLabels();
    layout(); draw();
    window.scrollTo(0, 0);
  }

  $("startBtn").onclick = startGame;
  $("shuffleBtn").onclick = () => { if (!state.animating) startGame(); };
  $("backBtn").onclick = () => {
    if (state.animating) return;
    $("game").classList.add("hidden");
    $("setup").classList.remove("hidden");
    $("headerSub").textContent = "참가자와 결과를 입력하세요";
    renderInputs();
  };

  // 폴드 접기/펼치기 등 화면 크기 변화 시 다시 그리기
  let rz;
  window.addEventListener("resize", () => {
    clearTimeout(rz);
    rz = setTimeout(() => { if (!$("game").classList.contains("hidden")) { layout(); draw(); } }, 120);
  });

  // 오프라인 실행용 서비스워커 등록 (HTTPS 주소에서만 동작, 실패해도 게임은 정상)
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }

  load();
  renderFx();
  renderInputs();
})();
</script>
</body>
</html>
